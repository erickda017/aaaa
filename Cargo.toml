[workspace]
resolver = "3"
members = ["crates/voice-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# O DSP precisa ser rápido mesmo em debug (callback de áudio em tempo real).
[profile.dev.package.voice-core]
opt-level = 3
